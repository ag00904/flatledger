# FlatLedger CI (T6): runs on GitHub's machines on every push to main and every pull request.
# Actions are pinned to full commit SHAs (T6-d); the tag is in the comment. Dependabot updates them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# T6-e: the job token can only read the repo; no secrets are used.
permissions:
  contents: read

# A newer run on the same branch cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Gradle, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      # Also checks gradle-wrapper.jar against Gradle's official checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
      - run: ./gradlew test --no-daemon

  frontend:
    name: Frontend (Node 24, lint, format, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  image:
    name: Docker image (build; push to ghcr.io on main)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Only this job may upload images, and only to this repo's package on ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Log in only on pushes to main; pull requests (including Dependabot's) build but never upload.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/ag00904/flatledger:sha-${{ github.sha }}
            ghcr.io/ag00904/flatledger:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # T7: Render runs the image CI built. It deploys only after all three jobs pass on main.
  deploy:
    name: Deploy to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The deploy hook URL is a secret (anyone with it can trigger a deploy), stored in the repo's
      # Actions secrets. imgURL pins the deploy to the exact image this run built.
      - name: Trigger Render deploy of this commit's image
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/ag00904/flatledger:sha-${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL is not set"; exit 1; fi
          curl --fail-with-body --silent --show-error -X POST --get "$HOOK" --data-urlencode "imgURL=$IMAGE" -o /dev/null -w "Render answered HTTP %{http_code}\n"
